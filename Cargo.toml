[package]
name = "peats-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A lightweight, Zen-inspired web browser for Fedora"
license = "MIT"

[workspace]
members = ["peats-core", "windows"]
default-members = [".", "peats-core"]

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["gtk_v4_22", "v1_9"] }
anyhow = "1.0"
dirs = "7.0"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_22"] }
peats-core = { path = "peats-core" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
soup3 = "0.9"
url = "2.5.9"
webkit = { package = "webkit6", version = "0.6.1", features = ["v2_52"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
